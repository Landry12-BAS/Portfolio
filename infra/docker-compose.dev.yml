# A local run of the stack: the same compose file as the box, with three differences.
#   - The images are built from this working tree, not pulled from GHCR.
#   - There is no tunnel (cloudflared is behind the `tunnel` profile) and the egress proxies
#     are behind the `egress` profile, so nothing here reaches the internet unless you ask.
#   - Caddy is published on 127.0.0.1 only, so a local site or curl can call the API.
#
#   just stack-secrets && just stack up -d --build --wait
#   curl -H 'Host: localhost' http://127.0.0.1:8180/api/lb01/customers
#
# LB-05 starts on its `small` dataset here, not the two-million-order one the box makes.
#
# `--profile egress` starts the two proxies, for trying a real provider key through the
# gateway; `--profile backup` makes the backup service runnable (infra/backup).

x-django-build: &django-build
  context: ..
  dockerfile: infra/docker/django-systems.Dockerfile
x-flask-build: &flask-build
  context: ..
  dockerfile: infra/docker/flask-systems.Dockerfile
x-node-build: &node-build
  context: ..
  dockerfile: infra/docker/node-systems.Dockerfile

services:
  gateway:
    build:
      context: ..
      dockerfile: infra/docker/gateway.Dockerfile

  django-migrate:
    build: *django-build
  django-api:
    build: *django-build
  django-worker:
    build: *django-build

  flask-migrate:
    build: *flask-build
  flask-seed:
    build: *flask-build
    environment:
      # A small dataset (about 28,000 orders) makes a local stack up in seconds.
      LB05_SEED_SIZE: small
  flask-api:
    build: *flask-build

  node-migrate:
    build: *node-build
  node-seed:
    build: *node-build
  node-api:
    build: *node-build
  node-worker:
    build: *node-build

  egress-gateway:
    profiles: [egress]
    build: &egress-build
      context: ..
      dockerfile: infra/docker/egress.Dockerfile
  egress-systems:
    profiles: [egress]
    build: *egress-build

  backup:
    build:
      context: ..
      dockerfile: infra/docker/backup.Dockerfile
    # Backups land in a folder you can read, instead of in R2.
    volumes:
      - ./.dev/backups:/backups

  cloudflared:
    profiles: [tunnel]

  caddy:
    ports:
      - "127.0.0.1:${LB_DEV_PORT:-8180}:8080"
    # Docker publishes a port only from a network that has a route out, so Caddy joins
    # `outbound` here. On the box it does not.
    networks: [outbound]
