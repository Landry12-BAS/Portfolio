# Redis 8 settings for the box (the `redis` service in docker-compose.yml).
#
# Redis holds what the platform can't afford to forget or to miscount: the gateway's
# budgets and quotas (a daily budget that reset on a restart would overspend a provider's
# free tier), the run-span streams the Scope reads, and Celery's queue. Who may do what is
# in users.acl.tmpl; this file sets how Redis persists, limits itself and logs.

# --- Network ---------------------------------------------------------------------
# The container sits on the internal `data` network only, so listening on every IPv4
# address reaches nothing outside it.
bind 0.0.0.0
port 6379
protected-mode yes
tcp-keepalive 60
timeout 0

# --- Access ----------------------------------------------------------------------
# The ACL file is written at start-up from users.acl.tmpl, with each password hashed from
# the environment (infra/redis/entrypoint.sh). Nobody can use a channel unless an ACL rule
# names it.
aclfile /run/redis/users.acl
acl-pubsub-default resetchannels
# Off already by default in Redis 8; stated so nobody turns them on by accident.
enable-debug-command no
enable-protected-configs no
enable-module-command no

# --- Memory ----------------------------------------------------------------------
# A full Redis refuses writes instead of silently evicting a budget or a queued job, and
# the gateway fails closed on a refused write. The container's limit is above this, for
# the append-only file's rewrite buffer.
maxmemory 384mb
maxmemory-policy noeviction

# --- Persistence -----------------------------------------------------------------
dir /data
appendonly yes
appendfsync everysec
save 900 1
save 300 100
save 60 10000

# --- Logging ---------------------------------------------------------------------
loglevel notice
logfile ""
