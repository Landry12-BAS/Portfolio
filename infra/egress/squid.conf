# Squid as an allowlisted egress proxy (infra/docker/egress.Dockerfile).
#
# Containers on the internal Docker networks have no route to the internet. The only way
# out is this proxy, which sits on an internet-facing network of its own and tunnels HTTPS
# (the CONNECT method, port 443) to the host names the entrypoint wrote into the allowlist
# from LB_EGRESS_ALLOW. Anything else is refused: plain HTTP, other ports, other hosts,
# IP addresses. Each caller group has its own proxy and its own list, so the gateway can
# reach only the model providers and the systems can reach only R2 and Sentry.

http_port 3128

# The allowlist: one host name per line. A leading dot also allows every subdomain.
acl allowed_hosts dstdomain "/run/lb-egress/allowed-hosts.txt"
acl tunnel_method method CONNECT
acl https_port port 443

# The only rule that allows anything.
http_access allow tunnel_method https_port allowed_hosts
http_access deny all

# A tunnel is never cached, and nothing is stored on disk.
cache deny all
cache_mem 8 MB
memory_pools off

# Logs go to the container's output, one line per tunnel, with no files to rotate or fill.
# A CONNECT line shows the host and port only, never a path, header or body.
access_log stdio:/dev/stdout
cache_log /dev/stderr
cache_store_log none
logfile_rotate 0
pid_filename none
coredump_dir /tmp

# Say nothing about what is running or who asked.
via off
forwarded_for delete
httpd_suppress_version_string on
visible_hostname lb-egress

# A closing container stops quickly: tunnels in flight are model calls that the gateway
# retries on another provider anyway.
shutdown_lifetime 2 seconds
