# The folder in memory where the live release's decrypted secrets go (decrypt-secrets.sh
# makes /run/lb/secrets inside it, mode 700, and refuses it if it is not a tmpfs). It is
# owned by the deploy user, who runs both the deploy and the unit that decrypts at boot.
#
# Install (docs/DEPLOY.md, The box):
#   sudo install -m 0644 infra/systemd/lb.tmpfiles.conf /etc/tmpfiles.d/lb.conf
#   sudo systemd-tmpfiles --create /etc/tmpfiles.d/lb.conf
#
# Type  Path     Mode  User    Group   Age
d       /run/lb  0750  deploy  deploy  -
