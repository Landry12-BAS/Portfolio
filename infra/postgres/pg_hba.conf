# Who may connect to Postgres, and how (docs/SECURITY.md, section 5).
#
# The superuser can log in only through the unix socket, as the operating-system user
# `postgres`: the provisioner and the owner (`docker compose exec -u postgres postgres
# psql`) are in the container or share the socket volume, and no password sent over
# the network can ever open a superuser session. Every other role logs in over the
# internal `data` network with a SCRAM password, to the one database, and nothing else is
# let in. `samenet` means the networks this container is attached to (only `data`).
#
# TYPE  DATABASE  USER      ADDRESS   METHOD
local   all       postgres            peer
local   all       all                 reject
host    all       postgres  all       reject
host    lb        all       samenet   scram-sha-256
host    all       all       all       reject
