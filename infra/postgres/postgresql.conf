# Postgres 17 settings for the box (the `postgres` service in docker-compose.yml).
#
# This file replaces the generated postgresql.conf entirely, so everything the server
# needs is here. Sized for a container limited to 2 GB inside a 12 GB machine that
# every other service shares: a shared buffer pool of a quarter of the limit, and
# connection counts for a dozen small services rather than a busy application.

# --- Connections -----------------------------------------------------------------
# The container sits on the internal `data` network only, which is IPv4, so listening on
# every IPv4 address reaches nothing outside it. Who may log in is decided by pg_hba.conf.
listen_addresses = '0.0.0.0'
port = 5432
unix_socket_directories = '/var/run/postgresql'
unix_socket_permissions = 0770
hba_file = '/etc/postgresql/pg_hba.conf'
max_connections = 100
superuser_reserved_connections = 3
password_encryption = scram-sha-256

# --- Memory ----------------------------------------------------------------------
shared_buffers = 256MB
effective_cache_size = 768MB
work_mem = 8MB
maintenance_work_mem = 128MB
# Docker gives a container 64 MB of /dev/shm unless told otherwise; compose sets 128 MB,
# and parallel query is kept small so it never needs more.
dynamic_shared_memory_type = posix
max_parallel_workers_per_gather = 1

# --- Write-ahead log and checkpoints -----------------------------------------------
wal_level = replica
wal_compression = on
max_wal_size = 1GB
min_wal_size = 80MB
checkpoint_completion_target = 0.9
# The volume is block storage, which behaves like an SSD.
random_page_cost = 1.1

# --- Logging ---------------------------------------------------------------------
# Container output only. Statements are never logged: a role's password travels in an
# ALTER ROLE statement when the provisioner sets it (infra/postgres/provision.sh), and
# visitors' tickets travel in INSERTs. Slow statements are logged by duration alone.
log_destination = 'stderr'
logging_collector = off
log_min_messages = warning
log_min_error_statement = panic
log_min_duration_statement = -1
log_statement = 'none'
log_connections = off
log_disconnections = off
log_line_prefix = '%m [%p] %q%u@%d '
log_timezone = 'UTC'

# --- Locale ----------------------------------------------------------------------
timezone = 'UTC'
datestyle = 'iso, mdy'
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'en_US.utf8'
# What initdb would have chosen for these locales. LB-01 names its search configuration
# ("english") in every query, so nothing depends on this default.
default_text_search_config = 'pg_catalog.english'
