# Routing for the integration tests: four fake providers that mirror the real ones
# (a Groq-like one, a Workers AI-like one metered in Neurons, an OpenRouter-like one
# that may train on inputs, and a dev-only one like NVIDIA), with small limits and
# short timeouts so every rule can be exercised in milliseconds.
version: 1

budgets:
  minuteCeiling: 0.9
  dayCeiling: 0.95
  alertAt: 0.7

timeouts:
  firstTokenMs: 400
  responseMs: 600
  idleMs: 400
  deadlineMs: 4000

providers:
  alpha:
    name: Alpha
    baseUrl: ${ALPHA_URL}
    keyEnv: ALPHA_KEY
    trainsOnInputs: false
    terms: production
    maxTokensParam: max_completion_tokens
    models:
      small:
        id: alpha/small-model
        context: 32768
        capabilities: [chat, tools, json_schema, reasoning]
        limits:
          minute: { requests: 30, tokens: 8000 }
          day: { requests: 1000, tokens: 200000 }
      big:
        id: alpha/big-model
        context: 32768
        capabilities: [chat, tools]
        limits:
          minute: { requests: 30, tokens: 8000 }
      tiny:
        id: alpha/tiny-model
        context: 32768
        capabilities: [chat]
        # 2 x 0.95 leaves room for exactly one call a day.
        limits:
          day: { requests: 2 }
      # Prompt Guard-like classifiers. 10 x 0.95 leaves the first one room for nine
      # segments a day.
      guard:
        id: alpha/guard-model
        context: 512
        capabilities: [guard]
        limits:
          day: { requests: 10 }
      guard-small:
        id: alpha/guard-small-model
        context: 512
        capabilities: [guard]
      # Speech to text, limited in seconds of audio. 600 x 0.95 is 570 a day, and an hour holds
      # 120 x 0.9 = 108.
      whisper:
        id: alpha/whisper-model
        context: 448
        capabilities: [transcription]
        limits:
          minute: { requests: 20 }
          hour: { audioSeconds: 120 }
          day: { requests: 100, audioSeconds: 600 }
      # 22 x 0.95 leaves room for two recordings a day: each is billed at least 10 seconds.
      whisper-day:
        id: alpha/whisper-day-model
        context: 448
        capabilities: [transcription]
        limits:
          day: { audioSeconds: 22 }
      # 25 x 0.9 leaves room for two recordings an hour, however the day goes.
      whisper-hour:
        id: alpha/whisper-hour-model
        context: 448
        capabilities: [transcription]
        limits:
          hour: { audioSeconds: 25 }

  beta:
    name: Beta
    baseUrl: ${BETA_URL}
    runUrl: ${BETA_RUN_URL}
    keyEnv: BETA_KEY
    trainsOnInputs: false
    terms: production
    limits:
      minute: { requests: 300 }
      day: { neurons: 10000 }
    models:
      small:
        id: '@beta/small-model'
        context: 32768
        capabilities: [chat, tools]
        neurons: { input: 10, output: 20 }
      big:
        id: '@beta/big-model'
        context: 32768
        capabilities: [chat, tools]
        neurons: { input: 30, output: 60 }
      vision:
        id: '@beta/vision-model'
        context: 32768
        capabilities: [chat, vision]
        neurons: { input: 25, output: 75 }
      embed:
        id: '@beta/embed-model'
        context: 8192
        capabilities: [embedding]
        neurons: { input: 1, output: 0 }
      rerank:
        id: '@beta/rerank-model'
        context: 512
        capabilities: [rerank]
        neurons: { input: 1, output: 0 }
        scores: logits
      whisper:
        id: '@beta/whisper-model'
        context: 448
        capabilities: [transcription]
        api: run
        neuronsPerAudioMinute: 30

  gamma:
    name: Gamma
    baseUrl: ${GAMMA_URL}
    keyEnv: GAMMA_KEY
    trainsOnInputs: true
    terms: production
    limits:
      minute: { requests: 20 }
      day: { requests: 50 }
    headers:
      X-Title: LB tests
    models:
      big:
        id: gamma/big-model:free
        context: 65536
        capabilities: [chat, tools, vision]
      whisper:
        id: gamma/whisper-model:free
        context: 448
        capabilities: [transcription]

  delta:
    name: Delta
    baseUrl: ${DELTA_URL}
    keyEnv: DELTA_KEY
    trainsOnInputs: true
    terms: dev-only
    models:
      big:
        id: delta/big-model
        context: 65536
        capabilities: [chat, tools]

aliases:
  lb-fast:
    description: Classification
    kind: chat
    maxInputTokens: 3000
    maxOutputTokens: 512
    chain: [alpha/small, beta/small]

  lb-tools:
    description: Chat and tool calls
    kind: chat
    maxInputTokens: 4000
    maxOutputTokens: 1024
    chain: [alpha/big, beta/big, gamma/big, delta/big]

  lb-tiny:
    description: One call a day
    kind: chat
    maxInputTokens: 1000
    maxOutputTokens: 256
    chain: [alpha/tiny]

  lb-vision:
    description: Images
    kind: chat
    maxInputTokens: 6000
    maxOutputTokens: 512
    chain: [beta/vision, gamma/big]

  lb-embed:
    description: Embeddings
    kind: embedding
    maxInputTokens: 2000
    chain: [beta/embed]

  lb-rerank:
    description: Reranking
    kind: rerank
    maxInputTokens: 400
    chain: [beta/rerank]

  lb-guard:
    description: Injection check
    kind: guard
    maxInputTokens: 800
    threshold: 0.9
    chain: [alpha/guard, alpha/guard-small]

  # The model that trains on inputs is first, so only the data class keeps visitors off it.
  lb-stt:
    description: Speech to text
    kind: transcription
    maxAudioSeconds: 30
    chain: [gamma/whisper, alpha/whisper, beta/whisper]

  lb-stt-day:
    description: Speech to text, two recordings a day
    kind: transcription
    maxAudioSeconds: 15
    chain: [alpha/whisper-day]

  lb-stt-hour:
    description: Speech to text, two recordings an hour
    kind: transcription
    maxAudioSeconds: 15
    chain: [alpha/whisper-hour]

  # Eval Lab's pinned aliases: one model each, for the flask-systems service only. The second sits on the
  # provider that trains on inputs, so it takes synthetic content only.
  lb-eval-alpha:
    description: Eval Lab, pinned to the first provider
    kind: chat
    maxInputTokens: 3000
    maxOutputTokens: 512
    services: [flask-systems]
    chain: [alpha/small]

  lb-eval-gamma:
    description: Eval Lab, pinned to the provider that trains
    kind: chat
    maxInputTokens: 3000
    maxOutputTokens: 512
    services: [flask-systems]
    syntheticOnly: true
    chain: [gamma/big]

systems:
  lb-01:
    name: Support Desk Agent
    service: django-systems
    aliases: [lb-fast, lb-tools, lb-tiny, lb-vision, lb-embed, lb-rerank, lb-guard]
    maxCallsPerRun: 4
    sessionDailyCalls: 6
    dailyCalls: 50
  lb-05:
    name: Data Analyst
    service: flask-systems
    aliases: [lb-fast]
    maxCallsPerRun: 4
    sessionDailyCalls: 20
    dailyCalls: 50
  lb-09:
    name: Meeting Recorder
    service: django-systems
    aliases: [lb-fast, lb-stt, lb-stt-day, lb-stt-hour]
    maxCallsPerRun: 4
    sessionDailyCalls: 12
    dailyCalls: 100

  lb-10:
    name: Eval Lab
    service: flask-systems
    aliases: [lb-eval-alpha, lb-eval-gamma]
    maxCallsPerRun: 4
    sessionDailyCalls: 20
    dailyCalls: 50

# A trace reader that may see LB-01's runs and not LB-05's, to test the per-system limit.
traceReaders:
  web:
    name: Test site
    systems: [lb-01]
