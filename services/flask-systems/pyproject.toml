# The Flask systems: LB-05 Data Analyst and LB-03 Invoice Reader today, then LB-10 Eval
# Lab. One Flask app; each system keeps its data in a Postgres schema of its own.
# Run its checks from this folder: `uv run pytest`, `uv run mypy .`.
[project]
name = "flask-systems"
version = "0.1.0"
description = "The LB systems built on Flask: one app, one Postgres schema per system."
requires-python = ">=3.13,<3.15"
dependencies = [
    "alembic>=1.20.0",
    # LB-03: S3-compatible storage (Cloudflare R2).
    "boto3>=1.40.0",
    "duckdb>=1.5.6",
    # No `async` extra: the views are plain functions. LB-03's documents are read on an asyncio loop
    # of their own (lb03/runner.py), because a Flask async view's loop ends with its request.
    "flask>=3.1.3,<3.2",
    "flask-openapi3>=4.3.2",
    "gunicorn>=26.2.0",
    "lb-common",
    "numpy>=2.5.3",
    # LB-03's reading of a document, which only the OCR worker process imports: OCR (RapidOCR on
    # ONNX Runtime, with its models inside the wheel), a PDF renderer under a permissive licence
    # (pdfium; not MuPDF, which is AGPL), image decoding, and the headless build of OpenCV that
    # RapidOCR needs (see [tool.uv] in the workspace root for why it is not `opencv-python`).
    "onnxruntime>=1.30.0",
    "opencv-python-headless>=4.12.0",
    "pillow>=12.0.0",
    "psycopg[binary]>=3.3.6",
    "pyjwt[crypto]>=2.15.1",
    "pypdfium2>=5.0.0",
    "pyyaml>=6.0.3",
    "rapidocr>=3.9.2",
    "redis>=8.1.0",
    "sqlalchemy>=2.1.1",
    "sqlglot>=30.21.0",
]

[tool.uv.sources]
lb-common = { workspace = true }

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib", "--strict-markers", "--strict-config"]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: needs a real Postgres, and Redis for some tests",
    "ocr: starts the real OCR worker, a few seconds a document (deselect with -m 'not ocr')",
]
xfail_strict = true
filterwarnings = ["error"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
# These ship no type information: Testcontainers, the S3 client and its fake, the PDF renderer, the PDF writer, the OCR.
module = ["testcontainers.*", "boto3.*", "botocore.*", "moto.*", "pypdfium2.*", "reportlab.*", "rapidocr.*"]
ignore_missing_imports = true
