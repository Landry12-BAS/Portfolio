# The Flask systems: LB-05 Data Analyst today, then LB-03 Invoice Reader and LB-10 Eval
# Lab. One Flask app; each system keeps its data in a Postgres schema of its own.
# Run its checks from this folder: `uv run pytest`, `uv run mypy .`.
[project]
name = "flask-systems"
version = "0.1.0"
description = "The LB systems built on Flask: one app, one Postgres schema per system."
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "duckdb>=1.5.6",
    "flask>=3.1.3,<3.2",
    "flask-openapi3>=4.3.2",
    "gunicorn>=26.2.0",
    "lb-common",
    "numpy>=2.5.3",
    "psycopg[binary]>=3.3.6",
    "pyjwt[crypto]>=2.15.1",
    "pyyaml>=6.0.3",
    "redis>=8.1.0",
    "sqlalchemy>=2.1.1",
    "sqlglot>=30.21.0",
]

[tool.uv.sources]
lb-common = { workspace = true }

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib", "--strict-markers", "--strict-config"]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: needs a real Postgres, and Redis for some tests",
]
xfail_strict = true
filterwarnings = ["error"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
# Testcontainers ships no type information.
module = ["testcontainers.*"]
ignore_missing_imports = true
