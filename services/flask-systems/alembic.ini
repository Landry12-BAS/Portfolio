# Alembic's settings for the Flask systems. Migrations normally run through `just migrate-flask`
# (manage.py migrate), which hands Alembic a connection of each system's own engine. This file
# lets Alembic's command line work too, for writing a revision:
#
#     uv run --directory services/flask-systems --env-file .env alembic -n lb05 revision -m "what changed"
#
# Each system has a section of its own, because each owns its migrations and its schema.

[alembic]
script_location = lb05/migrations
file_template = %%(rev)s_%%(slug)s

[lb05]
script_location = lb05/migrations
file_template = %%(rev)s_%%(slug)s

[lb03]
script_location = lb03/migrations
file_template = %%(rev)s_%%(slug)s

[lb10]
script_location = lb10/migrations
file_template = %%(rev)s_%%(slug)s
