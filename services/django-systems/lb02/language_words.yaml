# The words and letters LB-02 reads a visitor's language from (lb02/languages.py), for the
# Latin-script languages it knows. Checked by the strict reader in lb02/languages.py when
# the module loads, so a typo stops the service at start-up.
#
# common   the commonest words of the language and the words of a booking, all lowercase,
#          two letters or more (one-letter words belong to too many languages). Each is
#          worth one point.
# strong   greetings and words almost no other language here shares. Each is worth two.
# letters  letters that, among these languages, belong to this one alone. Each is worth two.
#
# Czech and Slovak share most of their letters and many words, so their lists lean on the
# words and letters that tell them apart: chci and chcem, pro and pre, děkuji and ďakujem.

