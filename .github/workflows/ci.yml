name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege (docs/SECURITY.md, section 7): CI only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NUXT_TELEMETRY_DISABLED: 1
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  web:
    name: Lint, types, tests and end-to-end
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Actions are pinned by commit SHA; the comment names the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile
      - name: No high or critical advisories in dependencies
        run: pnpm audit --audit-level high
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Generated files are up to date
        run: pnpm check

      - run: pnpm --filter @lb/web build
      - run: pnpm --filter @lb/web exec playwright install --with-deps chromium
      - name: End-to-end, accessibility and security headers
        run: pnpm --filter @lb/web e2e

      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
          if-no-files-found: ignore

  python:
    name: Python lint, types and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The Python integration tests, and the real gateway the contract tests start, need
    # a Redis. The version matches the gateway's own integration tests. The Django tests
    # need Postgres with pgvector, the version production runs.
    services:
      redis:
        image: redis:8.10-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: lb
          POSTGRES_PASSWORD: lb-ci-only
          POSTGRES_DB: lb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lb"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      LB_TEST_REDIS_URL: redis://127.0.0.1:6379
      LB_TEST_DATABASE_URL: postgres://lb:lb-ci-only@127.0.0.1:5432/lb
      # Every uv command fails rather than change uv.lock.
      UV_LOCKED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node runs the real gateway for the contract tests.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile

      # Pinned to the version that wrote uv.lock; uv then fetches Python 3.13 (.python-version).
      - name: Install uv
        run: pipx install uv==0.12.19
      - run: uv sync
      - name: No known vulnerabilities in Python dependencies
        run: uv audit --preview-features audit-command
      - run: uv run ruff check python scripts services/django-systems services/flask-systems
      - run: uv run ruff format --check python scripts services/django-systems services/flask-systems
      - name: Every module, class and function has a docstring
        run: uv run python scripts/check_docstrings.py
      - run: uv run mypy python/lb-common scripts
      - name: Django systems type-check, with the Django plugin
        run: uv run --directory services/django-systems mypy .
      - name: Flask systems type-check
        run: uv run --directory services/flask-systems mypy .
      - name: Unit, integration and gateway contract tests
        run: uv run pytest
      - name: Django systems migrations match their models
        working-directory: services/django-systems
        env:
          DJANGO_SETTINGS_MODULE: config.test_settings
          LB_DATABASE_URL: postgres://lb:lb-ci-only@127.0.0.1:5432/lb
        run: uv run python manage.py makemigrations --check --dry-run
      - name: Django systems unit and integration tests
        run: uv run --directory services/django-systems pytest
      - name: Flask systems unit and integration tests
        run: uv run --directory services/flask-systems pytest
