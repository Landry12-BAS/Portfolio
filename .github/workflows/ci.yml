name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege (docs/SECURITY.md, section 7): CI only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NUXT_TELEMETRY_DISABLED: 1
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  web:
    name: Lint, types, tests and end-to-end
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Actions are pinned by commit SHA; the comment names the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Generated files are up to date
        run: pnpm check

      - run: pnpm --filter @lb/web build
      - run: pnpm --filter @lb/web exec playwright install --with-deps chromium
      - name: End-to-end, accessibility and security headers
        run: pnpm --filter @lb/web e2e

      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
          if-no-files-found: ignore
