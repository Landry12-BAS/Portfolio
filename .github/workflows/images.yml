name: Images

# Builds the platform's container images for linux/amd64 and linux/arm64: the box is an ARM
# machine, while CI and most laptops are not, so both are built every time. Two workflows
# call this one:
#
#   ci.yml      on pull requests, with push: false. Nothing leaves the runner, but every
#               image is built for both architectures, so a Dockerfile that breaks (on ARM
#               alone, too) fails the pull request.
#   deploy.yml  on main, once CI has passed, with push: true. Each image is pushed to GHCR
#               under the commit's hash, scanned for fixable high and critical
#               vulnerabilities, signed keylessly with cosign, and the signature is checked
#               straight away the way the box will check it, so a signer identity that does
#               not match shows up here and not as a failed deploy.
#
# This workflow asks for no permissions of its own: it can do what its caller grants. A
# build that does not push needs `contents: read`; pushing needs `packages: write`, and
# keyless signing needs `id-token: write`. Only deploy.yml grants those two.

on:
  workflow_call:
    inputs:
      ref:
        description: The git commit to build, as its full hash. It becomes the image tag.
        type: string
        required: true
      push:
        description: Push the images to GHCR, sign them and check the signatures.
        type: boolean
        default: false

jobs:
  image:
    name: ${{ matrix.image.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # One line per image this repository builds and the Compose file runs. Adding a
        # service that has a Dockerfile of its own is one more line here (docs/DEPLOY.md,
        # Adding a service). The image is ghcr.io/<owner>/lb-<name>.
        image:
          - { name: gateway, dockerfile: infra/docker/gateway.Dockerfile }
          - { name: django-systems, dockerfile: infra/docker/django-systems.Dockerfile }
          - { name: flask-systems, dockerfile: infra/docker/flask-systems.Dockerfile }
          - { name: node-systems, dockerfile: infra/docker/node-systems.Dockerfile }
          - { name: lb07-sandbox, dockerfile: infra/docker/lb07-sandbox.Dockerfile }
          - { name: egress, dockerfile: infra/docker/egress.Dockerfile }
          - { name: backup, dockerfile: infra/docker/backup.Dockerfile }
    steps:
      # Actions are pinned by commit SHA; the comment names the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # GHCR wants the owner in lowercase.
      - name: Name the image
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
          NAME: ${{ matrix.image.name }}
        run: echo "name=ghcr.io/${OWNER,,}/lb-${NAME}" >> "$GITHUB_OUTPUT"

      # The runner is amd64; QEMU runs the arm64 steps of the build.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: inputs.push
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build the image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.push }}
          tags: ${{ steps.image.outputs.name }}:${{ inputs.ref }}
          labels: org.opencontainers.image.revision=${{ inputs.ref }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}
          # Attached to the image index, so they are covered by its signature.
          provenance: ${{ inputs.push && 'mode=max' || 'false' }}
          sbom: ${{ inputs.push }}

      # A fixable high or critical vulnerability in the finished image stops the release here,
      # before it is signed, and the box runs only signed images. Vulnerabilities with no fix
      # yet are left to the base image's maintainers; `just pin-images` takes their fix.
      - name: Scan the image
        if: inputs.push
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Install cosign
        if: inputs.push
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # The release infra/scripts/install-tool.sh puts on the box: what signs and what
          # verifies are the same version.
          cosign-release: v3.0.6

      # The image is signed by its digest, not its tag, since a tag can move. The
      # certificate names this workflow, run from main, which is what deploy.sh demands.
      - name: Sign the image, and check the signature as the box will
        if: inputs.push
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          REPOSITORY: ${{ github.repository }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"
          cosign verify \
            --certificate-identity-regexp "^https://github\.com/${REPOSITORY//./\\.}/\.github/workflows/(images|deploy)\.yml@refs/heads/main\$" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${IMAGE}@${DIGEST}" > /dev/null
