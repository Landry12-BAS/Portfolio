packages:
  - apps/*
  - packages/*
  - services/*

# Install scripts this repo never needs:
# - unrs-resolver (ESLint import rules) ships prebuilt binaries; its script only
#   rebuilds from source.
# - ssh2 and cpu-features (pulled in by Testcontainers) only compile optional native
#   crypto speed-ups; ssh2 falls back to JavaScript, and tests never use SSH.
# - protobufjs only runs a version notice for its CLI.
# - msgpackr-extract (pulled in by BullMQ) only builds an optional native speed-up;
#   without it msgpackr uses its JavaScript decoder.
# - vue-demi (pulled in by Vue Flow) picks a Vue 2 or Vue 3 build by version in its script; its
#   default files are the Vue 3 ones, which is all this site uses.
ignoredBuiltDependencies:
  - cpu-features
  - msgpackr-extract
  - protobufjs
  - ssh2
  - unrs-resolver
  - vue-demi

# esbuild's install script only verifies its prebuilt binary for this platform.
onlyBuiltDependencies:
  - esbuild

# drizzle-kit, the tool that writes LB-08's migrations (a development tool: nothing serves
# requests with it), still pulls in the retired @esbuild-kit loader, whose old esbuild has an
# advisory about its development server, which nothing here starts. Pinning that one esbuild
# to a patched release keeps `pnpm audit` clean.
overrides:
  '@esbuild-kit/core-utils>esbuild': ^0.25.0

# GHSA-86w9-cpqp-85rv: node-forge (up to 1.4.0, the newest release) accepts a forged RSA PKCS#1 v1.5
# signature. It has no patched release yet, so no pin can fix it. The only way in is
# nuxt > @nuxt/cli > listhen, the development server's helper that makes a self-signed certificate
# for `nuxt dev --https`; nothing verifies a signature with it, and the production build does not
# contain node-forge (`grep -r node-forge apps/web/.output` finds nothing). Remove this entry, and
# run `pnpm audit`, when node-forge or listhen publishes a fix.
auditConfig:
  ignoreGhsas:
    - GHSA-86w9-cpqp-85rv
