    expect: {rejects: [cycle]}
    attempt:
      name: Wait for stock
      nodes:
        - {id: started, type: trigger, label: Start, event: manual}
        - {id: check_stock, type: action, label: Check stock, connector: stock_check, params: {sku: basalt-blend-1kg}}
        - {id: enough, type: condition, label: Above 50 kg?, field: check_stock.availableKg, op: gt, value: 50}
        - {id: tell_purchasing, type: action, label: Tell purchasing, connector: slack_alert, params: {channel: '#purchasing', message: Basalt Blend is back.}}
      edges:
        - {from: started, to: check_stock}
