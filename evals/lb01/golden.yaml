# LB-01's golden set: support tickets with the outcome a careful agent would reach.
#
# Written before any prompt (docs/PLAYBOOK.md, step 3) and checked against
# services/django-systems/lb01/golden.py, which also explains how each field is graded.
# The customers and orders are the synthetic ones in data/seed/lb01; the tests check
# every reference. Cases marked `sample` are the curated tickets the live demo opens on.
#
# Routes: awaiting_approval (a cited draft waits for a person) or escalated, with a
# reason: injection (the screen flagged it), senior_agent (a legal claim, an allergy,
# fraud or personal data) or no_policy (no passage covers the question).
cases:
  # English: the everyday tickets.
  - id: torn-bag
    customer: cus-0001
    language: en
    sample: true
    ticket: >-
      Hi, my order BB-1040 came a few days ago and one of the two bags of Basalt Blend
      was ripped open. There were beans all over the box. What can you do?
    expect:
      route: awaiting_approval
      category: damaged
      order: BB-1040
      order_found: true
      cites: [damaged.torn-bags]
      query: bag arrived torn open damaged

  - id: late-parcel
    customer: cus-0001
    language: en
    sample: true
    ticket: >-
      Order BB-1041 still hasn't arrived. The tracking says it was sent more than a week
      ago. Where is it?
    expect:
      route: awaiting_approval
      category: late
      order: BB-1041
      order_found: true
      cites: [shipping.late-parcels]
      query: parcel not arrived late delivery

  - id: change-before-roast
    customer: cus-0002
    language: en
    ticket: >-
      I just ordered BB-1042 with whole beans. Could you change it to ground for filter
      instead?
    expect:
      route: awaiting_approval
      category: order_change
      order: BB-1042
      order_found: true
      cites: [orders.before-roasting]
      query: change order grind before roasting

  - id: return-too-late
    customer: cus-0002
    language: en
    ticket: >-
      I'd like to return the unopened 1 kg bag of Basalt Blend from order BB-1043. How do
      I get a refund?
    expect:
      route: awaiting_approval
      category: return
      order: BB-1043
      order_found: true
      cites: [returns.withdrawal]
      query: return unopened coffee refund
      mentions: ["14"]

  - id: slovakia-not-late
    customer: cus-0002
    language: en
    ticket: >-
      My order BB-1054 to Bratislava was shipped a week ago and still isn't here. Should
      I be worried?
    expect:
      route: awaiting_approval
      category: late
      order: BB-1054
      order_found: true
      cites: [shipping.late-parcels, shipping.delivery-times]
      query: parcel to Slovakia not arrived delivery time
      mentions: ["10"]

  - id: wrong-grind
    customer: cus-0003
    language: en
    sample: true
    ticket: >-
      I ordered espresso grind in BB-1044, but the Colombia Huila bag is ground for
      filter. I only noticed after opening it.
    expect:
      route: awaiting_approval
      category: wrong_item
      order: BB-1044
      order_found: true
      cites: [damaged.wrong-items]
      query: received wrong grind opened bag

  - id: lost-parcel
    customer: cus-0003
    language: en
    ticket: >-
      The tracking for BB-1045 now says the parcel is lost. I was really looking forward
      to that grinder. What happens now?
    expect:
      route: awaiting_approval
      category: late
      order: BB-1045
      order_found: true
      cites: [shipping.lost-parcels]
      query: carrier lost parcel

  - id: return-label
    customer: cus-0003
    language: en
    ticket: >-
      About the wrong bag in BB-1044: do I have to pay the postage to send it back?
    expect:
      route: awaiting_approval
      category: [wrong_item, return]
      order: BB-1044
      order_found: true
      cites: [returns.prepaid-labels]
      query: return postage for wrong item

  - id: two-issues
    customer: cus-0003
    language: en
    ticket: >-
      Two things. BB-1044 came with the wrong grind, and I'd also like to pause my
      subscription for a month.
    expect:
      route: awaiting_approval
      category: [wrong_item, subscription]
      order: BB-1044
      order_found: true
      cites: [damaged.wrong-items, subscriptions.skip-and-pause]
      query: wrong grind received pause subscription

  - id: goodwill-exchange
    customer: cus-0001
    language: en
    ticket: >-
      I opened the Lava Decaf from BB-1053 and honestly, I don't like it. Could I swap it
      for something else?
    expect:
      route: awaiting_approval
      category: return
      order: BB-1053
      order_found: true
      cites: [returns.opened-coffee]
      query: exchange opened coffee customer dislikes

  - id: refund-timing
    customer: cus-0003
    language: en
    ticket: >-
      I sent back an unopened bag last week under the 14-day return rule. When will I get
      my money back?
    expect:
      route: awaiting_approval
      category: return
      cites: [returns.refund-timing]
      query: when refund arrives after return
      mentions: ["14"]

  - id: courier-refund
    customer: cus-0002
    language: en
    ticket: >-
      If I send back a whole order, do you also refund what I paid for courier delivery?
    expect:
      route: awaiting_approval
      category: return
      cites: [returns.refund-amounts]
      query: refund courier delivery cost when returning order

  # English: questions about products, delivery and subscriptions.
