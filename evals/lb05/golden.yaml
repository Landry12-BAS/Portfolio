  # ---- customers and repeat buyers ----------------------------------------------------------
  - id: lost-repeat-buyers-last-quarter
    question: Which coffees lost the most repeat buyers last quarter?
    topic: customers
    difficulty: hard
    sample: true
    order: exact
    sql: |
      WITH purchases AS (
        SELECT orders.customer_id AS customer_id, products.name AS product, orders.ordered_at AS day
        FROM orders
        JOIN order_lines ON order_lines.order_id = orders.order_id
        JOIN products ON products.product_id = order_lines.product_id
        WHERE orders.status NOT IN ('cancelled', 'lost') AND products.kind = 'coffee'
      ), earlier AS (
        SELECT DISTINCT customer_id, product FROM purchases
        WHERE day BETWEEN $quarter_before_last_start AND $quarter_before_last_end
      ), before_earlier AS (
        SELECT DISTINCT customer_id, product FROM purchases WHERE day < $quarter_before_last_start
      ), asked AS (
        SELECT DISTINCT customer_id, product FROM purchases
        WHERE day BETWEEN $last_quarter_start AND $last_quarter_end
      )
      SELECT earlier.product AS product, COUNT(*) AS lost_repeat_buyers
      FROM earlier
      JOIN before_earlier ON before_earlier.customer_id = earlier.customer_id AND before_earlier.product = earlier.product
      LEFT JOIN asked ON asked.customer_id = earlier.customer_id AND asked.product = earlier.product
      WHERE asked.customer_id IS NULL
      GROUP BY earlier.product
      ORDER BY lost_repeat_buyers DESC

  - id: repeat-buyers-last-quarter
    question: How many repeat buyers did each coffee have last quarter?
    topic: customers
    difficulty: hard
    sql: |
      WITH purchases AS (
        SELECT orders.customer_id AS customer_id, products.name AS product, orders.ordered_at AS day
        FROM orders
        JOIN order_lines ON order_lines.order_id = orders.order_id
        JOIN products ON products.product_id = order_lines.product_id
        WHERE orders.status NOT IN ('cancelled', 'lost') AND products.kind = 'coffee'
      ), in_period AS (
        SELECT DISTINCT customer_id, product FROM purchases
        WHERE day BETWEEN $last_quarter_start AND $last_quarter_end
      ), before_period AS (
        SELECT DISTINCT customer_id, product FROM purchases WHERE day < $last_quarter_start
      )
      SELECT in_period.product AS product, COUNT(*) AS repeat_buyers
      FROM in_period
      JOIN before_period ON before_period.customer_id = in_period.customer_id AND before_period.product = in_period.product
      GROUP BY in_period.product

  - id: one-time-customers
    question: How many customers have placed only one order, not counting cancelled or lost ones?
    topic: customers
    difficulty: medium
    sql: |
      SELECT COUNT(*) AS one_time_customers
      FROM (
        SELECT orders.customer_id AS customer_id
        FROM orders
        WHERE orders.status NOT IN ('cancelled', 'lost')
        GROUP BY orders.customer_id
        HAVING COUNT(DISTINCT orders.order_id) = 1
      ) AS singles

  - id: customers-ordering-every-quarter-last-year
    question: How many customers ordered in every quarter of last year?
    topic: customers
    difficulty: hard
    sql: |
      SELECT COUNT(*) AS regular_customers
      FROM (
        SELECT orders.customer_id AS customer_id
        FROM orders
        WHERE orders.status NOT IN ('cancelled', 'lost') AND orders.ordered_at BETWEEN $last_year_start AND $last_year_end
        GROUP BY orders.customer_id
        HAVING COUNT(DISTINCT DATE_TRUNC('quarter', orders.ordered_at)) = 4
      ) AS regulars

  - id: retained-signups-this-year
    question: Of the customers who signed up last year, how many have placed an order this year?
    topic: customers
    difficulty: hard
    sql: |
      SELECT COUNT(DISTINCT customers.customer_id) AS retained_customers
      FROM customers
      JOIN orders ON orders.customer_id = customers.customer_id
      WHERE customers.signup_date BETWEEN $last_year_start AND $last_year_end
        AND orders.status NOT IN ('cancelled', 'lost')
        AND orders.ordered_at BETWEEN $this_year_start AND $this_year_end

  - id: lapsed-customers
    question: How many customers have ordered before but not in the last 90 days?
    topic: customers
    difficulty: hard
    sql: |
      SELECT COUNT(*) AS lapsed_customers
      FROM (
        SELECT orders.customer_id AS customer_id, MAX(orders.ordered_at) AS last_order
        FROM orders
        WHERE orders.status NOT IN ('cancelled', 'lost')
        GROUP BY orders.customer_id
      ) AS last_orders
      WHERE last_orders.last_order < $last_90_days_start

  - id: existing-customers-ordering-last-quarter
    question: How many customers who ordered last quarter had registered before last quarter began?
    topic: customers
    difficulty: medium
    sql: |
      SELECT COUNT(DISTINCT orders.customer_id) AS existing_customers
      FROM orders
      JOIN customers ON customers.customer_id = orders.customer_id
      WHERE orders.status NOT IN ('cancelled', 'lost')
        AND orders.ordered_at BETWEEN $last_quarter_start AND $last_quarter_end
        AND customers.signup_date < $last_quarter_start

  - id: orders-per-buyer-last-year
    question: On average, how many orders did each customer who ordered last year place?
    topic: customers
    difficulty: medium
    tolerance: 0.01
    sql: |
      SELECT COUNT(DISTINCT orders.order_id) FILTER (WHERE orders.status NOT IN ('cancelled', 'lost'))
             / COUNT(DISTINCT orders.customer_id) FILTER (WHERE orders.status NOT IN ('cancelled', 'lost')) AS orders_per_buyer
      FROM orders
      WHERE orders.ordered_at BETWEEN $last_year_start AND $last_year_end

  - id: first-time-kenya-buyers-last-quarter
    question: How many customers bought Kenya Nyeri for the first time last quarter?
    topic: customers
    difficulty: hard
    sql: |
      SELECT COUNT(*) AS first_time_buyers
      FROM (
        SELECT orders.customer_id AS customer_id, MIN(orders.ordered_at) AS first_purchase
        FROM orders
        JOIN order_lines ON order_lines.order_id = orders.order_id
        JOIN products ON products.product_id = order_lines.product_id
        WHERE orders.status NOT IN ('cancelled', 'lost') AND products.name = 'Kenya Nyeri'
        GROUP BY orders.customer_id
      ) AS firsts
      WHERE firsts.first_purchase BETWEEN $last_quarter_start AND $last_quarter_end
