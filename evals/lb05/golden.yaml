  - id: equipment-buyer-share-last-year
    question: What percentage of the customers who ordered last year bought any equipment?
    topic: join
    difficulty: hard
    tolerance: 0.1
    sql: |
      WITH buyers AS (
        SELECT orders.customer_id AS customer_id,
               MAX(CASE WHEN products.kind = 'equipment' THEN 1 ELSE 0 END) AS bought_equipment
        FROM orders
        JOIN order_lines ON order_lines.order_id = orders.order_id
        JOIN products ON products.product_id = order_lines.product_id
        WHERE orders.status NOT IN ('cancelled', 'lost') AND orders.ordered_at BETWEEN $last_year_start AND $last_year_end
        GROUP BY orders.customer_id
      )
      SELECT ROUND(100.0 * SUM(buyers.bought_equipment) / COUNT(*), 1) AS equipment_buyer_percent FROM buyers

  - id: items-per-order-last-quarter
    question: How many items does an average order hold, counting last quarter's orders?
