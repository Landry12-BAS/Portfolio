  - id: equipment-revenue-share-last-year
    question: What percentage of last year's revenue came from equipment?
    topic: ratio
    difficulty: medium
    tolerance: 0.1
    sql: |
      SELECT ROUND(100.0 * SUM(order_lines.line_total_czk) FILTER (WHERE products.kind = 'equipment')
                   / SUM(order_lines.line_total_czk), 1) AS equipment_percent
      FROM orders
      JOIN order_lines ON order_lines.order_id = orders.order_id
      JOIN products ON products.product_id = order_lines.product_id
      WHERE orders.status NOT IN ('cancelled', 'lost') AND orders.ordered_at BETWEEN $last_year_start AND $last_year_end

