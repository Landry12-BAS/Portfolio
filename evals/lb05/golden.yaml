      FROM orders
      JOIN order_lines ON order_lines.order_id = orders.order_id
      WHERE orders.subscription_id IS NOT NULL AND orders.ordered_at BETWEEN $last_year_start AND $last_year_end

  - id: kettle-buyers-by-country-last-year
    question: How many different customers bought a Gooseneck Kettle last year, by country?
    topic: join
    difficulty: hard
    sql: |
      SELECT customers.country AS country,
             COUNT(DISTINCT orders.customer_id) FILTER (WHERE orders.status NOT IN ('cancelled', 'lost')) AS buyers
      FROM orders
      JOIN customers ON customers.customer_id = orders.customer_id
      JOIN order_lines ON order_lines.order_id = orders.order_id
      JOIN products ON products.product_id = order_lines.product_id
      WHERE products.name = 'Gooseneck Kettle' AND orders.ordered_at BETWEEN $last_year_start AND $last_year_end
