             / COUNT(DISTINCT orders.order_id) FILTER (WHERE orders.status NOT IN ('cancelled', 'lost')) AS items_per_order
      FROM orders
      JOIN order_lines ON order_lines.order_id = orders.order_id
      WHERE orders.ordered_at BETWEEN $last_quarter_start AND $last_quarter_end

  - id: delivery-income-by-carrier-last-year
