  - id: best-product-per-country-last-year
    question: For each customer country, which product earned the most revenue last year?
    topic: ranking
    difficulty: hard
    sql: |
      WITH by_country AS (
        SELECT customers.country AS country, products.name AS product,
               SUM(order_lines.line_total_czk) FILTER (WHERE orders.status NOT IN ('cancelled', 'lost')) AS revenue
        FROM orders
        JOIN customers ON customers.customer_id = orders.customer_id
        JOIN order_lines ON order_lines.order_id = orders.order_id
        JOIN products ON products.product_id = order_lines.product_id
        WHERE orders.ordered_at BETWEEN $last_year_start AND $last_year_end
        GROUP BY customers.country, products.name
      ), ranked AS (
        SELECT by_country.country AS country, by_country.product AS product, by_country.revenue AS revenue,
               ROW_NUMBER() OVER (PARTITION BY by_country.country ORDER BY by_country.revenue DESC) AS place
        FROM by_country
      )
      SELECT ranked.country AS country, ranked.product AS product, ranked.revenue AS revenue
      FROM ranked
      WHERE ranked.place = 1

