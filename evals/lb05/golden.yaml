  - id: average-order-value-by-segment-last-year
    question: What was the average order value for home customers and for business customers last year?
    topic: join
    difficulty: hard
    tolerance: 0.05
    sql: |
      SELECT customers.segment AS segment,
             SUM(order_lines.line_total_czk) FILTER (WHERE orders.status NOT IN ('cancelled', 'lost'))
             / COUNT(DISTINCT orders.order_id) FILTER (WHERE orders.status NOT IN ('cancelled', 'lost')) AS average_order_value
      FROM orders
      JOIN customers ON customers.customer_id = orders.customer_id
      JOIN order_lines ON order_lines.order_id = orders.order_id
      WHERE orders.ordered_at BETWEEN $last_year_start AND $last_year_end
      GROUP BY customers.segment

  - id: subscriptions-by-coffee
